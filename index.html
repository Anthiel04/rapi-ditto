<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Rapi-Ditto · Respuestas rápidas</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --paper: #fffaf3;
            --coffee: #543b2b;
            --brown: #79563f;
            --muted: #9b8876;
            --line: #e8dccd;
            --accent: #a06e48;
            --accent-light: #efe2d3;
            --dark: #39291f;
            --shadow: 0 10px 28px #62432b12
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--dark);
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif
        }

        button,
        input {
            font: inherit
        }

        button {
            cursor: pointer;
            border: 0
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 230px 1fr
        }

        .sidebar {
            background: var(--coffee);
            color: #fff;
            padding: 25px 16px;
            display: flex;
            flex-direction: column;
            gap: 22px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 20px;
            font-weight: 760;
            padding: 4px 8px;
            letter-spacing: -.5px
        }

        .logo {
            width: 36px;
            height: 36px;
            background: #c49a72;
            color: #fff;
            border-radius: 12px;
            display: grid;
            place-items: center
        }

        .navlabel {
            font-size: 10px;
            color: #c1a995;
            font-weight: 750;
            letter-spacing: 1.3px;
            margin: 0 10px
        }

        .nav {
            display: grid;
            gap: 7px
        }

        .nav button {
            display: flex;
            gap: 12px;
            align-items: center;
            text-align: left;
            color: #dfcbbb;
            background: transparent;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px
        }

        .nav button:hover,
        .nav button.active {
            background: #70523d;
            color: #fff
        }

        .nav button.active {
            box-shadow: inset 3px 0 #d4b18c
        }

        .navicon {
            width: 20px;
            text-align: center
        }

        .side-note {
            margin-top: auto;
            padding: 14px;
            border: 1px solid #81624c;
            border-radius: 13px;
            color: #d9c5b4;
            font-size: 12px;
            line-height: 1.6
        }

        .side-note strong {
            display: block;
            color: white;
            margin-bottom: 4px
        }

        main {
            padding: 30px clamp(16px, 4vw, 46px);
            max-width: 1500px;
            width: 100%;
            margin: auto
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px
        }

        .eyebrow {
            font-size: 11px;
            color: var(--accent);
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: 1px
        }

        .h1 {
            font-size: 28px;
            letter-spacing: -1px;
            font-weight: 760;
            margin: 7px 0
        }

        .sub {
            color: var(--muted);
            font-size: 14px
        }

        .topright {
            display: flex;
            gap: 10px
        }

        .search {
            position: relative
        }

        .search input {
            width: 250px;
            border: 1px solid var(--line);
            background: var(--paper);
            border-radius: 11px;
            padding: 11px 14px 11px 37px;
            outline: none;
            color: var(--dark)
        }

        .search span {
            position: absolute;
            left: 12px;
            top: 11px;
            color: var(--muted)
        }

        .sectionhead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 0 0 14px
        }

        .sectionhead h2 {
            font-size: 17px;
            margin: 0
        }

        .sectionhead p {
            font-size: 12px;
            color: var(--muted);
            margin: 5px 0
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px
        }

        .item {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 17px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .itemtop {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px
        }

        .itemtitle {
            font-weight: 720;
            font-size: 14px
        }

        .tag {
            font-size: 11px;
            color: var(--brown);
            background: var(--accent-light);
            padding: 5px 8px;
            border-radius: 8px;
            white-space: nowrap
        }

        .itembody {
            font-size: 13px;
            color: #705e4f;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .copy {
            background: var(--coffee);
            color: #fff;
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            align-self: flex-start
        }

        .copy:hover {
            background: #75533c
        }

        .priceTable {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        .priceTable th {
            text-align: left;
            color: #a08b76;
            font-size: 11px;
            font-weight: 650;
            border-bottom: 1px solid var(--line);
            padding: 8px 5px
        }

        .priceTable td {
            padding: 10px 5px;
            border-bottom: 1px solid #f0e6dc;
            color: #6f5948
        }

        .priceTable tr:last-child td {
            border-bottom: 0
        }

        .priceTable td:last-child {
            text-align: right;
            font-weight: 750;
            color: var(--coffee)
        }

        .copytable {
            margin-top: 12px
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            background: var(--paper);
            border: 1px dashed var(--line);
            border-radius: 15px
        }

        .hidden {
            display: none !important
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--coffee);
            color: #fff;
            padding: 12px 17px;
            border-radius: 12px;
            font-size: 13px;
            opacity: 0;
            transition: .25s;
            pointer-events: none
        }

        .toast.show {
            opacity: 1
        }

        @media(max-width:800px) {
            .app {
                grid-template-columns: 1fr
            }

            .sidebar {
                padding: 12px 14px;
                display: block
            }

            .brand {
                margin-bottom: 12px
            }

            .navlabel,
            .side-note {
                display: none
            }

            .nav {
                display: flex;
                overflow: auto
            }

            .nav button {
                white-space: nowrap;
                padding: 9px 11px
            }

            .top {
                align-items: flex-start;
                flex-direction: column
            }

            .topright {
                width: 100%
            }

            .search {
                flex: 1
            }

            .search input {
                width: 100%
            }

            .cards {
                grid-template-columns: 1fr
            }

            main {
                padding: 22px 15px
            }

            .h1 {
                font-size: 24px
            }
        }

        @media(max-width:430px) {
            .topright {
                flex-wrap: wrap
            }

            .search {
                min-width: 100%
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                Rapi-ditto
            </div>
            <div class="navlabel">RESPUESTAS FRECUENTES</div>
            <nav class="nav" id="nav">
                <button class="active" data-section="frequent"><span class="navicon">⌂</span> Más frecuentes</button>
                <button data-section="prices"><span class="navicon">$</span> Tabla de precios</button>
                <button data-section="messages"><span class="navicon">▤</span> Mensajes</button>
                <button data-section="addresses"><span class="navicon">⌖</span> Direcciones</button>
                <button data-section="questions"><span class="navicon">☷</span> Datos del cliente</button>
            </nav>
            <div class="side-note"><strong>Un espacio práctico</strong>Información lista para copiar y pegar, sin
                distracciones.</div>
        </aside>
        <main>
            <div class="top">
                <div>
                    <div class="eyebrow">Panel de uso diario</div>
                    <div class="h1" id="heading">Más frecuentes</div>
                    <div class="sub">Atajos para responder y atender más rápido.</div>
                </div>
                <div class="topright">
                    <div class="search"><span>⌕</span><input id="search" placeholder="Buscar..." /></div>
                </div>
            </div>
            <div class="sectionhead">
                <div>
                    <h2 id="sectiontitle">Más frecuentes</h2>
                    <p id="sectiondesc">Accesos rápidos a tus textos recurrentes</p>
                </div>
            </div>
            <div class="cards" id="cards"></div>
            <div class="empty hidden" id="empty">No se encontró contenido.</div>
        </main>
    </div>
    <div class="toast" id="toast">Copiado</div>
    <script>
        const data = [
            { id: 1, category: "messages", title: "Saludo inicial", body: "¡Hola! 👋 Gracias por contactarnos. ¿Cómo podemos ayudarte hoy?", frequent: true },
            {
                id: 2, category: "messages", title: "Zelle", body: `Cuenta Zelle Empresarial
Numero: 786 258 7334
Nombre: ODD CAR INVESMENTS LLC
Monto de la Asesoría: 149 USD`, frequent: true
            },
            { id: 3, category: "messages", title: "Pago rápido", body: "https://link.fastpaydirect.com/payment-link/68a8ca7d67ee3b22c6687618", frequent: true },
            {
                id: 4, category: "addresses", title: "Dirección / ubicación", body: `Dirección: 1475 Palm Ave, Hialeah, FL 33010
Teléfono: (786) 600-2222
Horario: Cierra a las 6 p.m.`, frequent: true
            },
            { id: 5, category: "prices", title: "Lista de precios", prices: [["Valor", "Precio"], ["$0 - $5,999", "$599"], ["$6,000 - $10,999", "$699"], ["$11,000 - $15,999", "$799"], ["$16,000 +", "$899"]], frequent: false },
            { id: 6, category: "messages", title: "Confirmación", body: "¡Perfecto! Hemos recibido tu información. Muchas gracias. Te confirmaremos los detalles a la brevedad.", frequent: false },
            {
                id: 7, category: "questions", title: "Vehículo deseado", body: `Motivo de compra
¿Por qué quiere adquirir un vehículo?
Finalidad
¿Para qué necesita el vehículo?
Tipo de vehículo
¿Qué tipo de vehículo está buscando?
Marca o modelo
¿Tiene alguna preferencia específica?
Características
¿Qué características considera importantes?
Presupuesto
¿Cuál es el presupuesto o rango de inversión disponible?
Restricciones
¿Qué características no acepta o qué condiciones deben cumplirse?
Información adicional
Cualquier otro dato relevante para la búsqueda posterior del inventario.`, frequent: true
            },
            {
                id: 8, category: "questions", title: "Preguntas de financiación", body: `¿A qué se dedica/trabaja? 

¿Cuánto tiempo lleva ahí?

!!!Si lleva menos de 2 años: ¿Dónde trabajaba antes? ¿Se dedicaba a lo mismo?

¿Más o menos cuánto está ganando al mes?

¿Actualmente está pagando algún carro?

¿Cuánto tiene pensado dar de inicial (Downpayment)?

¿En cuánto tiene su puntaje de crédito?

`, frequent: false
            }, {
                id: 9, category: "questions", title: "Nota de Gohighlevel", body: ` Motivo de compra
Razón por la cual busca adquirir un vehículo mediante subasta.
 Finalidad del vehículo
Uso que el cliente dará al vehículo.
 Tipo de vehículo
Tipo de vehículo solicitado.

Preferencias específicas mencionadas.

Año, motor, transmisión, combustible, cantidad de pasajeros, equipamiento y otras características.
 Presupuesto
Rango de inversión indicado por el cliente.
 Restricciones
Características o condiciones que deben evitarse.
 Información adicional
Cualquier otro dato que pueda ayudar al Closer a encontrar un inventario adecuado.

`, frequent: false
            }, {
                id: 10, category: "questions", title: "Asesoría", body: ` Este servicio está diseñado para orientarte durante todo el proceso de búsqueda y análisis del vehículo, brindándote asesoría personalizada para que puedas hacer una mejor compra.

Incluye:
5 sesiones personalizadas mediante videollamadas por Google Meet durante 15 días.

Acceso exclusivo a subastas privadas reservadas para dealers como Manheim, ACV Auctions y Adesa.

Análisis detallado del historial del vehículo que selecciones (accidentes, mantenimientos, propietarios anteriores, millaje, etc.).

Reporte Carfax del vehículo que desees revisar.

Recomendaciones estratégicas sobre cuánto apostar para aumentar tus posibilidades de ganar en la subasta.


Sesiones adicionales: $39 USD cada una.

Costo: $149 USD (no reembolsable tras uso).

`, frequent: false
            }, {
                id: 11, category: "messages", title: "Enlace del Dealer", body: `https://lasubastacubana.com/dealer/inventory?order[default]=asc`, frequent: true
            },{
                id: 12, category: "questions", title: "Formulario de financiación", body: `https://lasubastacubana.com/apply-online`, frequent: false
            }
        ];
        const labels = { prices: "Precios", messages: "Mensaje", addresses: "Dirección", questions: "Datos del cliente" };
        let section = "frequent"; const cards = document.getElementById("cards"), search = document.getElementById("search");
        function copy(txt) { navigator.clipboard.writeText(txt).then(() => toast("Copiado al portapapeles ✓")).catch(() => toast("No se pudo copiar")) }
        function toast(t) { let e = document.getElementById("toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 1700) }
        function render() { let q = search.value.toLowerCase().trim(); let list = data.filter(x => (section === "frequent" ? x.frequent : section === "all" || x.category === section) && (!q || (x.title + " " + (x.body || "") + " " + (x.prices || []).flat().join(" ")).toLowerCase().includes(q))); document.getElementById("heading").textContent = section === "frequent" ? "Más frecuentes" : section === "prices" ? "Tabla de precios" : section === "messages" ? "Mensajes rápidos" : section === "addresses" ? "Direcciones" : "Datos del cliente"; document.getElementById("sectiontitle").textContent = section === "frequent" ? "Más frecuentes" : section === "prices" ? "Tabla de precios" : labels[section]; document.getElementById("sectiondesc").textContent = section === "frequent" ? "Accesos rápidos a tus textos recurrentes" : "Información lista para copiar"; cards.innerHTML = ""; document.getElementById("empty").classList.toggle("hidden", list.length > 0); list.forEach(x => { let el = document.createElement("article"); el.className = "item"; el.innerHTML = `<div class="itemtop"><div class="itemtitle"></div><span class="tag"></span></div><div class="itembody"></div><div class="tablewrap hidden"><table class="priceTable"></table><button class="copy copytable">▣ Copiar tabla</button></div><button class="copy copytext">▣ Copiar</button>`; el.querySelector(".itemtitle").textContent = x.title; el.querySelector(".tag").textContent = labels[x.category]; if (x.prices) { el.querySelector(".itembody").classList.add("hidden"); let wrap = el.querySelector(".tablewrap"); wrap.classList.remove("hidden"); let t = el.querySelector("table"); x.prices.forEach((r, i) => { let tr = document.createElement("tr"); r.forEach((v, j) => { let c = document.createElement(i === 0 ? "th" : "td"); c.textContent = v; tr.append(c) }); t.append(tr) }); el.querySelector(".copytable").onclick = () => copy(x.prices.map(r => r.join("\\t")).join("\\n")); el.querySelector(".copytext").classList.add("hidden") } else { el.querySelector(".itembody").textContent = x.body; el.querySelector(".copytext").onclick = () => copy(x.body) } cards.append(el) }) }
        document.getElementById("nav").onclick = e => { let b = e.target.closest("button[data-section]"); if (!b) return; section = b.dataset.section; document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("active", x === b)); render() }; search.oninput = render; render();
    </script>
</body>

</html>
